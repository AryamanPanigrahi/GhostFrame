[package]
name = "rewind"
version = "0.1.0"
edition = "2021"

[dependencies]
# Inputs are sent over the network, so `RollbackGame::Input` must be
# serializable. `derive` generates the code for `PeerMsg` (R3).
serde = { version = "1", features = ["derive"] }
# PeerMsg travels as bincode bytes, the same format as the relay's messages.
bincode = "1"
# WebSocket client. quad-net (DESIGN.md section 9) is the one that works in
# the browser. Its native half is built on mio 0.6, which aborts on current
# Rust on Windows ("null reference produced"), so native builds use
# tungstenite instead. See SETUP.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-net = { version = "0.1.2", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# "handshake" is the HTTP upgrade. "rustls-tls-webpki-roots" adds `wss://`
# (TLS) using rustls, a TLS library written in Rust, with Mozilla's list of
# trusted certificate authorities built in, so there is no OpenSSL to install
# and nothing read from the system. `ws://` keeps working unchanged.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# tungstenite enables rustls with no crypto backend. rustls's default backend
# (aws-lc-rs) needs CMake and NASM to build, so pick `ring` instead, which
# builds with the C compiler the Rust toolchain already uses. With exactly one
# backend enabled, rustls picks it automatically. "tls12" keeps hosts that
# only offer TLS 1.2 reachable.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
