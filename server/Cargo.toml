[package]
name = "riposte-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime + WebSocket server (see SETUP.md section 6).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
# ClientMsg / ServerMsg are serialized with bincode over binary frames.
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
# "env-filter" lets the host set the log level with RUST_LOG.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
# Only for tests/relay.rs: a real WebSocket client, so the tests talk to the
# server over a real socket. Both are already in the tree via axum.
tokio-tungstenite = "0.29"
futures-util = "0.3"
# Only for tests/rewind_client.rs: drives the server with rewind's real
# WebSocketTransport, which also proves rewind's copy of the protocol enums
# matches ours.
rewind = { path = "../rewind" }
