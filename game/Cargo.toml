[package]
name = "riposte-game"
version = "0.1.0"
edition = "2021"

[dependencies]
# Window, keyboard and 2D drawing. Default features are off in 0.4, so the
# audio backend (which needs ALSA on Linux) is not pulled in.
macroquad = "0.4.16"
# Our rollback library, from this workspace (a path dependency, nothing to
# download). G5 implements its RollbackGame trait for GameState.
rewind = { path = "../rewind" }
# The relay client (relay.rs) encodes ClientMsg/ServerMsg itself, with the
# same serde + bincode versions as the server, so the bytes match.
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
# Tests only, never in the game or the browser build: relay.rs tests run the
# real server's room logic in-process and compare protocol bytes with the
# server's own types. Both are already in the workspace (nothing new is
# downloaded); tokio is only needed for the room logic's message channels.
riposte-server = { path = "../server" }
tokio = { version = "1", features = ["sync"] }
